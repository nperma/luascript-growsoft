<!doctype html>
<html lang="en" style="background-color: rgba(0, 0, 0, 0); width: 100%; height: 100%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Growtopia Player Support</title>
    <link
      rel="icon"
      type="image/png"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
      sizes="16x16"
    />
    <link
      rel="shortcut icon"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
      type="image/x-icon"
    />
    <link
      rel="icon"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
      type="image/x-icon"
    />
    <!-- include bootstrap and custom  css -->
    <link
      media="all"
      rel="stylesheet"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css"
    />
    <!-- include custom  css -->
    <link
      media="all"
      rel="stylesheet"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css"
    />
    <link
      media="all"
      rel="stylesheet"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css"
    />
    <title>GrowP Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: none;
        font-family: Arial, Helvetica, sans-serif;
        padding: 15px;
        overflow: auto;
      }

      /* Container */

      .login-box {
        width: min(800px, 100%);
        min-height: 450px;

        background: #45bdea;

        border-radius: 10px;

        padding: 35px;

        position: relative;

        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.15);
      }

      /* Border layer */

      .login-box::before {
        content: "";

        position: absolute;

        inset: 0;

        border: 6px solid #8edffe;

        border-radius: 8px;

        pointer-events: none;

        z-index: 2;

        filter: drop-shadow(3px 3px 0 black);
      }
      .title {
        text-align: center;
        color: white;
        font-size: 82px;
        font-weight: bold;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
        margin-bottom: 35px;
      }

      /* Login Register */

      .mode {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .mode input {
        display: none;
      }

      .mode label {
        width: 175px;
        height: 32px;

        cursor: pointer;

        display: flex;
        justify-content: center;
        align-items: center;

        color: white;
        font-size: 34px;
        font-weight: bold;

        background: #99d5ec;
        border-radius: 4px;

        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);

        transition: 0.15s;
      }

      .mode input:checked + label {
        background: #86c9e7;
        box-shadow: none;
      }

      .mode #login:checked + label {
        background: #fdcc04ff;
      }

      .mode #login + label {
        background: #fdcc04ff;
      }

      /* Input */

      .grow-input {
        width: 100%;
        height: 58px;

        border: 4px solid #8edffe !important;
        outline: none !important;
        appearance: none !important;
        -webkit-appearance: none !important;
        -moz-appearance: none !important;

        padding: 0 15px;

        margin-bottom: 18px;

        font-size: 34px;
        font-weight: bold;
        line-height: 1;

        color: white;
        background: rgba(0, 0, 0, 0.089);
        border-radius: 4px !important;
        box-sizing: border-box;
        overflow: hidden;
        position: relative;
        filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.705));
      }

      .grow-input,
      .grow-input::placeholder {
        position: relative;
        z-index: 1;
      }

      .grow-input::placeholder {
        color: white;
      }

      /* Checkbox */

      .creative {
        display: flex;
        align-items: center;
        gap: 18px;
        outline: none;

        margin-top: 5px;
      }

      .creative input {
        appearance: none;
        -webkit-appearance: none;

        width: 42px;
        height: 42px;
        outline: none;

        cursor: pointer;

        border: 4px solid #8edffe;
        border-radius: 3px;
        background: none;
        filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.705));

        position: relative;
      }
      .creative input:focus,
      .creative input:focus-visible {
        outline: none;
      }

      /* Ketika Checked */

      .creative input:checked {
        outline: none;
      }

      /* Centang */

      .creative input::after {
        content: "";

        position: absolute;
        outline: none;

        left: 50%;
        top: 50%;

        width: 10px;
        height: 20px;

        border: solid white;
        filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, 0.4));
        border-width: 0 4px 4px 0;

        transform: translate(-50%, -60%) rotate(45deg) scale(0);
      }

      /* Munculkan centang */

      .creative input:checked::after {
        outline: none;
        transform: translate(-50%, -60%) rotate(45deg) scale(1);
      }

      .creative label {
        color: white;
        font-size: 34px;
        font-weight: bold;

        cursor: pointer;
      }

      /* Button */

      .submit {
        margin-top: 20px;

        width: 100%;
        height: 58px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 15px;

        border: none;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        outline: none;
        overflow: hidden;

        background: radial-gradient(80% 80%, rgb(34, 225, 66), #3aaa35ff);
        filter: brightness(1.2);

        color: white;

        font-size: 30px;
        font-weight: bold;

        border-radius: 4px;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          filter 0.15s ease;
      }

      .submit:hover {
        filter: brightness(0.97);
      }

      .submit:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.25);
      }

      @media (max-height: 600px) and (orientation: landscape) {
        .login-box {
          width: min(90vw, 600px);
          padding: 20px;
          min-height: auto;
        }

        .title {
          font-size: 40px;
          margin-bottom: 12px;
        }

        .mode {
          margin-bottom: 10px;
          gap: 4px;
        }

        .mode label {
          font-size: 20px;
          height: 44px;
          width: 120px;
        }

        .grow-input {
          font-size: 18px;
          height: 40px;
          margin-bottom: 8px;
          padding: 0 10px;
        }

        .creative {
          gap: 10px;
          margin-top: 8px;
        }

        .creative input {
          width: 28px;
          height: 28px;
        }

        .creative label {
          font-size: 18px;
        }

        .submit {
          font-size: 20px;
          height: 40px;
          margin-top: 10px;
        }
      }
    </style>
  </head>

  <body style="background-color: rgba(0, 0, 0, 0); background: none">
    <div class="login-box">
      <h1 class="title">GrowP</h1>

      <div class="mode">
        <input checked type="radio" id="login" name="mode" class="login-button" />
        <label for="login">Login</label>

        <input type="radio" id="register" name="mode" />
        <label for="register">Register</label>
      </div>

      <form
        method="POST"
        action="https://5.39.13.31/player/growid/login/validate"
        accept-charset="UTF-8"
        role="form"
        required
        autocomplete="off"
      >
        <input
          name="_token"
          type="hidden"
          class="form-control grow-text"
          value="{{tokenPlaceholder}}"
        />
        <input id="serverName" name="server" type="hidden" value="GrowP" />

        <input class="grow-input" id="growId" name="growId" type="text" placeholder="GrowID" />

        <input
          class="grow-input"
          id="password"
          name="password"
          type="password"
          placeholder="Password"
        />

        <!-- Checkbox -->

        <div class="creative">
          <input id="creative" type="checkbox" />

          <label for="creative"> Play Creative </label>
        </div>

        <button class="submit" type="submit" name="action">Log in</button>
      </form>

      <!-- Input -->
    </div>
  </body>
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/vendors/jquery/jquery-2.1.4.min.js"></script>
  <!-- boostrap javascript -->
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/vendors/bootstrap/javascripts/bootstrap.min.js"></script>

  <script>
    $("document").ready(function () {
      document.onkeydown = (e) => {
        if (e.key == 123) {
          e.preventDefault();
        }
        if (e.key == "F12") {
          e.preventDefault();
        }
        if (e.ctrlKey && e.shiftKey && e.key == "I") {
          e.preventDefault();
        }
        if (e.ctrlKey && e.key == "I") {
          e.preventDefault();
        }
        if (e.ctrlKey && e.shiftKey && e.key == "C") {
          e.preventDefault();
        }
        if (e.ctrlKey && e.shiftKey && e.key == "J") {
          e.preventDefault();
        }
        if (e.ctrlKey && e.key == "U") {
          e.preventDefault();
        }
      };
      $(".close").on("click", function () {
        window.location = "https://5.39.13.31/player/validate/close";
      });
      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          for (var i = 0; i < mutation.addedNodes.length; i++) {
            if (mutation.addedNodes[i].tagName == "DIV") {
              var thediv = mutation.addedNodes[i];
              var sw = window.screen.width;
              if (sw < 667) {
                $(thediv).css({
                  transform: "scale(0.75)",
                  "transform-origin": "0 0",
                  "-webkit-transform": "scale(0.75)",
                  "-webkit-transform-origin": "0 0",
                  overflow: "auto",
                });
              }
            }
          }
        });
      });
      observer.observe(document.body, {
        attributes: false,
        childList: true,
        characterData: false,
      });
    });

    const title = document.querySelector(".title");

    const creative = document.getElementById("creative");
    const serverInput = document.getElementById("serverName");

    creative.addEventListener("change", () => {
      if (creative.checked) {
        title.textContent = "CreativeGrowP";
        serverInput.value = "CreativeGrowP";
      } else {
        title.textContent = "GrowP";
        serverInput.value = "GrowP";
      }
    });

    const password = document.querySelectorAll(".grow-input")[1];
    const login = document.getElementById("login");
    const register = document.getElementById("register");
    const submit = document.querySelector(".submit");

    login.onclick = () => {
      password.style.display = "block";
      password.value = "";
      submit.textContent = "Log in";
    };

    register.onclick = () => {
      password.value = "twst2392372839";
      password.style.display = "none";
      submit.textContent = "Create account";
    };
  </script>
</html>
